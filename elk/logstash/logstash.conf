input {
  beats {
    port => 5044
  }
}

filter {
  if [log_type] == "nginx_access" {
    grok {
      match => { "message" => "%{IPORHOST:client_ip} - %{DATA:remote_user} \[%{HTTPDATE:timestamp}\] \"%{WORD:method} %{DATA:request_path} HTTP/%{NUMBER:http_version}\" %{NUMBER:status_code} %{NUMBER:body_bytes_sent} \"%{DATA:referrer}\" \"%{DATA:user_agent}\" rt=%{NUMBER:request_time} uct=\"%{DATA:upstream_connect_time}\" uat=\"%{DATA:upstream_addr}\"" }
    }
    date {
      match => [ "timestamp", "dd/MMM/yyyy:HH:mm:ss Z" ]
      target => "@timestamp"
    }
  }

  else if [log_type] == "security_audit" {
    # Format: [2026-04-11 15:10:03] | WARNING | IP: 127.0.0.1 | METHOD: POST | PATH: /auth/login | STATUS: 401 | DURATION: 24.96ms
    if "|" in [message] {
      grok {
        match => { "message" => "\[%{TIMESTAMP_ISO8601:timestamp}\] \| %{LOGLEVEL:level} \| IP: %{IPORHOST:client_ip} \| METHOD: %{WORD:method} \| PATH: %{DATA:request_path} \| STATUS: %{NUMBER:status_code} \| DURATION: %{DATA:duration}" }
      }
      date {
        match => [ "timestamp", "yyyy-MM-dd HH:mm:ss" ]
        target => "@timestamp"
      }
    } else {
      # Handle rate limit messages: [2026-04-11 15:10:09] | WARNING | ratelimit 5 per 1 minute (127.0.0.1) exceeded at endpoint: /auth/login
      grok {
        match => { "message" => "\[%{TIMESTAMP_ISO8601:timestamp}\] \| %{LOGLEVEL:level} \| %{GREEDYDATA:alert_message}" }
      }
    }
  }

  else if [log_type] == "ai_activity" {
    json {
      source => "message"
    }
    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "banking-%{log_type}-%{+YYYY.MM.dd}"
    # Si l'authentification est activée par défaut dans les versions récentes :
    # user => "elastic"
    # password => "changeme"
  }
  # Utile pour le debug au début
  # stdout { codec => rubydebug }
}
