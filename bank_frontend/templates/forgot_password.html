<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Récupération de compte - API Bank</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="center-container">
    <div class="glass-box">
        <h1 class="brand">Récupération</h1>
        <p style="margin-bottom: 30px;">Entrez votre e-mail pour recevoir un code de réinitialisation.</p>

        {% if error %}
            <div class="alert alert-error">
                <span>{{ error }}</span>
                <button type="button" class="alert-btn-ok" onclick="this.closest('.alert').remove()">OK</button>
            </div>
        {% endif %}
        
        {% if message %}
            <div class="alert alert-success">
                <span>{{ message }}</span>
                <button type="button" class="alert-btn-ok" onclick="this.closest('.alert').remove()">OK</button>
            </div>
        {% endif %}

        <form method="POST">
            <div class="input-group">
                <label>Adresse E-mail</label>
                <input type="email" name="email" required placeholder="Ex: dalell@email.com" value="{{ email | default('') }}">
            </div>

            <button type="submit" class="btn">Envoyer le code</button>
            
            <p style="margin-top: 15px; font-size: 14px;">
                <a href="/" style="color: var(--primary); text-decoration: none;">Retour à la connexion</a>
            </p>
        </form>
    </div>
</div>

<script src="{{ url_for('static', filename='alerts.js') }}"></script>
</body>
</html>
