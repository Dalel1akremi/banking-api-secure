<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agences & DAB - API Bank</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>
    
    <style>
        .map-layout {
            display: flex;
            gap: 20px;
            height: calc(100vh - 190px);
            min-height: 540px;
            margin-top: 15px;
        }
        
        .sidebar {
            width: 380px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }
        
        .search-container {
            padding: 16px 18px;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .search-container input {
            width: 100%;
            padding: 11px 14px;
            border-radius: 10px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            background: rgba(15, 23, 42, 0.7);
            color: #f8fafc;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-container input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }
        
        .filter-pills {
            display: flex;
            gap: 8px;
        }
        .pill-btn {
            flex: 1;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .pill-btn:hover {
            background: rgba(99, 102, 241, 0.15);
            color: #fff;
        }
        .pill-btn.active {
            background: #4f46e5;
            border-color: #6366f1;
            color: #fff;
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.4);
        }
        
        .locations-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }
        
        .location-item {
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.03);
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .location-item:hover {
            background: rgba(99, 102, 241, 0.12);
            border-color: rgba(99, 102, 241, 0.4);
            transform: translateY(-1px);
        }
        
        .location-title {
            font-weight: 600;
            color: #f8fafc;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
        }
        
        .location-type {
            font-size: 10.5px;
            padding: 2px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        
        .type-bank { background: rgba(99, 102, 241, 0.25); color: #c7d2fe; border: 1px solid rgba(99, 102, 241, 0.4); }
        .type-atm { background: rgba(16, 185, 129, 0.25); color: #a7f3d0; border: 1px solid rgba(16, 185, 129, 0.4); }
        
        .location-distance {
            font-size: 12.5px;
            color: #fbbf24;
            margin-top: 4px;
            font-weight: 600;
        }
        
        .location-details {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 5px;
            line-height: 1.45;
        }
        
        #map {
            flex: 1;
            min-height: 540px;
            border-radius: 18px;
            border: 1px solid var(--card-border);
            z-index: 1;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            background: #0f172a;
        }
        
        /* Map custom styling */
        .leaflet-container {
            font-family: inherit;
            background: #0f172a !important;
        }
        .leaflet-tile {
            filter: brightness(0.95) contrast(1.05);
        }
        
        /* Bright popup override */
        .leaflet-popup-content-wrapper {
            background: #1e293b !important;
            color: #f8fafc !important;
            border-radius: 12px !important;
            border: 1px solid rgba(99, 102, 241, 0.3) !important;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5) !important;
        }
        .leaflet-popup-tip {
            background: #1e293b !important;
        }
        .leaflet-popup-content h4 {
            margin: 0 0 6px 0;
            color: #38bdf8;
            font-size: 14px;
            font-weight: bold;
        }
        .leaflet-popup-content p {
            margin: 3px 0;
            font-size: 12px;
            color: #cbd5e1;
        }
        
        /* Custom Vector Pins */
        .pin-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            border: 2px solid #fff;
        }
        .pin-marker.bank {
            background: linear-gradient(135deg, #6366f1, #4338ca);
        }
        .pin-marker.atm {
            background: linear-gradient(135deg, #10b981, #047857);
        }
        .pin-icon {
            transform: rotate(45deg);
            font-size: 16px;
            line-height: 1;
        }
        
        @media (max-width: 768px) {
            .map-layout {
                flex-direction: column;
                height: auto;
            }
            .sidebar {
                width: 100%;
                height: 320px;
            }
            #map {
                height: 420px;
                min-height: 420px;
            }
        }
    </style>
</head>
<body>

{% include 'nav.html' %}

<div class="page-container" style="max-width: 1400px;">
    <div class="page-header">
        <h1>📍 Agences & DAB les plus proches</h1>
        <p>Localisez nos agences et distributeurs automatiques (DAB) en Tunisie en haute définition avec itinéraire et horaires.</p>
    </div>

    <div class="map-layout">
        <div class="sidebar">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="🔍 Rechercher une région (ex: Tunis, Lac, Sousse, Sfax)...">
                <div class="filter-pills">
                    <button class="pill-btn active" onclick="setFilter('all', this)">Tous</button>
                    <button class="pill-btn" onclick="setFilter('bank', this)">🏦 Agences</button>
                    <button class="pill-btn" onclick="setFilter('atm', this)">🏧 DABs</button>
                </div>
            </div>
            <div class="locations-list" id="locationsList">
                <div style="padding: 20px; text-align: center; color: var(--text-muted);">
                    <p>Chargement de la carte...</p>
                </div>
            </div>
        </div>
        
        <div id="map"></div>
    </div>
</div>

<script>
    // ==========================================
    // DONNÉES RÉELLES PRÉ-CHARGÉES (TUNISIE)
    // ==========================================
    const DEFAULT_LOCATIONS = [
        { id: 101, name: "Siège Principal — Av. Habib Bourguiba", type: "bank", lat: 36.8002, lng: 10.1804, address: "74 Avenue Habib Bourguiba, Tunis 1001", working_hours: "08:00 - 16:30 (Lun-Ven)" },
        { id: 102, name: "DAB 24/7 — Avenue Bourguiba", type: "atm", lat: 36.8005, lng: 10.1808, address: "Face Théâtre Municipal, Tunis", working_hours: "24h/24 & 7j/7" },
        { id: 103, name: "Agence Les Berges du Lac 1", type: "bank", lat: 36.8324, lng: 10.2341, address: "Rue du Lac Windermere, Berges du Lac 1, Tunis", working_hours: "08:15 - 16:30 (Lun-Ven)" },
        { id: 104, name: "DAB 24/7 — Les Berges du Lac 1", type: "atm", lat: 36.8329, lng: 10.2348, address: "Près de l'Hôtel Mövenpick, Lac 1", working_hours: "24h/24 & 7j/7" },
        { id: 105, name: "Agence Les Berges du Lac 2", type: "bank", lat: 36.8485, lng: 10.2685, address: "Avenue de la Bourse, Les Berges du Lac 2", working_hours: "08:15 - 16:30 (Lun-Ven)" },
        { id: 106, name: "DAB 24/7 — Lac 2 Mall", type: "atm", lat: 36.8492, lng: 10.2690, address: "Entrée Principale Tunisia Mall, Lac 2", working_hours: "24h/24 & 7j/7" },
        { id: 107, name: "Agence Centre Urbain Nord", type: "bank", lat: 36.8415, lng: 10.1985, address: "Immeuble Horizon, Centre Urbain Nord, Tunis", working_hours: "08:00 - 16:30 (Lun-Ven)" },
        { id: 108, name: "DAB 24/7 — Centre Urbain Nord", type: "atm", lat: 36.8418, lng: 10.1990, address: "Rez-de-chaussée Tour Elysée, CUN", working_hours: "24h/24 & 7j/7" },
        { id: 109, name: "Agence Ennasr 2", type: "bank", lat: 36.8621, lng: 10.1582, address: "Avenue Hédi Nouira, Ennasr 2, Ariana", working_hours: "08:15 - 16:30 (Lun-Ven)" },
        { id: 110, name: "DAB 24/7 — Ennasr 2", type: "atm", lat: 36.8625, lng: 10.1588, address: "À côté de Carrefour Express, Ennasr 2", working_hours: "24h/24 & 7j/7" },
        { id: 111, name: "Agence El Menzah 6", type: "bank", lat: 36.8462, lng: 10.1654, address: "Rue Ahmed Tlili, El Menzah 6, Tunis", working_hours: "08:00 - 16:30 (Lun-Ven)" },
        { id: 112, name: "Agence La Marsa Plage", type: "bank", lat: 36.8795, lng: 10.3242, address: "Avenue Habib Bourguiba, La Marsa", working_hours: "08:15 - 16:30 (Lun-Ven)" },
        { id: 113, name: "DAB 24/7 — La Marsa Esplanade", type: "atm", lat: 36.8801, lng: 10.3248, address: "Place du Saf-Saf, La Marsa", working_hours: "24h/24 & 7j/7" },
        { id: 114, name: "Agence Carthage", type: "bank", lat: 36.8525, lng: 10.3298, address: "Avenue de la République, Carthage", working_hours: "08:15 - 16:30 (Lun-Ven)" },
        { id: 115, name: "Agence Ariana Ville", type: "bank", lat: 36.8628, lng: 10.1955, address: "Avenue de la République, Ariana 2080", working_hours: "08:00 - 16:30 (Lun-Ven)" },
        { id: 116, name: "Agence Sousse Corniche", type: "bank", lat: 35.8342, lng: 10.6385, address: "Boulevard Habib Bourguiba, Sousse", working_hours: "08:00 - 16:30 (Lun-Ven)" },
        { id: 117, name: "DAB 24/7 — Sousse Port El Kantaoui", type: "atm", lat: 35.8941, lng: 10.5975, address: "Marina Port El Kantaoui, Sousse", working_hours: "24h/24 & 7j/7" },
        { id: 118, name: "Agence Sfax Centre", type: "bank", lat: 34.7405, lng: 10.7602, address: "Avenue Hédi Chaker, Sfax 3000", working_hours: "08:00 - 16:30 (Lun-Ven)" },
        { id: 119, name: "DAB 24/7 — Sfax Bab Diwan", type: "atm", lat: 34.7388, lng: 10.7621, address: "Place Bab Diwan, Médina Sfax", working_hours: "24h/24 & 7j/7" },
        { id: 120, name: "Agence Bizerte Port", type: "bank", lat: 37.2744, lng: 9.8739, address: "Quai Tarak Ibn Ziad, Bizerte", working_hours: "08:00 - 16:30 (Lun-Ven)" },
        { id: 121, name: "Agence Nabeul Jarre", type: "bank", lat: 36.4561, lng: 10.7375, address: "Avenue Habib Thameur, Nabeul", working_hours: "08:00 - 16:30 (Lun-Ven)" }
    ];

    let locations = [...DEFAULT_LOCATIONS];
    let userLat = null;
    let userLng = null;
    let searchLat = null;
    let searchLng = null;
    let markers = [];
    let currentFilter = 'all';

    // 1. Initialisation de la carte Leaflet (Centrée sur Tunis)
    const map = L.map('map', {
        center: [36.8065, 10.1815],
        zoom: 12,
        zoomControl: true
    });

    // 2. TUILES RETINA HAUTE DÉFINITION (CartoDB Voyager - Ultra Net, Crisp & Lumineux)
    const retinaTiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 20,
        detectRetina: true,
        crossOrigin: true
    }).addTo(map);

    // FIX CRUCIAL LEAFLET: Forcer le redimensionnement pour éliminer le flou / tuiles grises
    setTimeout(() => { map.invalidateSize(); }, 200);
    setTimeout(() => { map.invalidateSize(); }, 600);
    window.addEventListener('resize', () => map.invalidateSize());

    // 3. Custom SVG Crisp Markers (Aucun problème de chargement réseau)
    function createCustomIcon(type) {
        const isBank = type === 'bank';
        const iconChar = isBank ? '🏦' : '🏧';
        const cls = isBank ? 'bank' : 'atm';
        return L.divIcon({
            className: 'custom-div-pin',
            html: `<div class="pin-marker ${cls}"><span class="pin-icon">${iconChar}</span></div>`,
            iconSize: [34, 34],
            iconAnchor: [17, 34],
            popupAnchor: [0, -32]
        });
    }

    let userMarker = null;

    function calculateDistance(lat1, lon1, lat2, lon2) {
        if (!lat1 || !lon1) return null;
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    function setFilter(filter, btn) {
        currentFilter = filter;
        document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        addMarkers();
        renderLocations();
    }

    function renderLocations() {
        const listEl = document.getElementById('locationsList');
        listEl.innerHTML = '';
        
        const centerLat = searchLat || userLat || 36.8065;
        const centerLng = searchLng || userLng || 10.1815;
        
        let displayList = locations.filter(loc => {
            if (currentFilter === 'all') return true;
            return loc.type === currentFilter;
        });

        displayList.forEach(loc => {
            loc.distance = calculateDistance(centerLat, centerLng, loc.lat, loc.lng);
        });
        displayList.sort((a, b) => (a.distance || 0) - (b.distance || 0));

        if (displayList.length === 0) {
            listEl.innerHTML = '<div style="padding: 25px; text-align: center; color: var(--text-muted);">Aucune agence ou DAB trouvé pour ce filtre.</div>';
            return;
        }
        
        displayList.forEach(loc => {
            const el = document.createElement('div');
            el.className = 'location-item';
            
            const isBank = loc.type === 'bank';
            const typeClass = isBank ? 'type-bank' : 'type-atm';
            const typeLabel = isBank ? '🏦 Agence' : '🏧 DAB 24/7';
            
            let distanceHtml = '';
            if (loc.distance !== null && loc.distance !== undefined) {
                distanceHtml = `<div class="location-distance">📍 à ${loc.distance.toFixed(2)} km</div>`;
            }
            
            let hoursHtml = loc.working_hours ? `<div style="margin-top: 4px; color: #818cf8; font-weight: 500;">🕒 ${loc.working_hours}</div>` : '';

            el.innerHTML = `
                <div class="location-title">
                    <span>${loc.name}</span>
                    <span class="location-type ${typeClass}">${typeLabel}</span>
                </div>
                ${distanceHtml}
                <div class="location-details">
                    <div>${loc.address}</div>
                    ${hoursHtml}
                </div>
            `;
            
            el.addEventListener('click', () => {
                map.flyTo([loc.lat, loc.lng], 16, { duration: 1.2 });
                const marker = markers.find(m => m.options.locId === loc.id);
                if (marker) {
                    setTimeout(() => marker.openPopup(), 400);
                }
            });
            
            listEl.appendChild(el);
        });
    }

    function addMarkers() {
        markers.forEach(m => map.removeLayer(m));
        markers = [];
        
        const filtered = locations.filter(loc => {
            if (currentFilter === 'all') return true;
            return loc.type === currentFilter;
        });

        filtered.forEach(loc => {
            const icon = createCustomIcon(loc.type);
            const marker = L.marker([loc.lat, loc.lng], { icon: icon, locId: loc.id }).addTo(map);
            
            const isBank = loc.type === 'bank';
            const badgeColor = isBank ? '#6366f1' : '#10b981';
            const badgeText = isBank ? 'Agence Bancaire' : 'Distributeur DAB 24/7';
            
            let hoursHtml = loc.working_hours ? `<p style="margin-top:5px; color:#a5b4fc;"><b>Horaires :</b> ${loc.working_hours}</p>` : '';
            marker.bindPopup(`
                <div style="min-width: 180px;">
                    <div style="display:inline-block; font-size:10px; font-weight:700; color:#fff; background:${badgeColor}; padding:2px 6px; border-radius:4px; margin-bottom:4px;">${badgeText}</div>
                    <h4>${loc.name}</h4>
                    <p><b>Adresse :</b> ${loc.address}</p>
                    ${hoursHtml}
                    <div style="margin-top:8px;">
                        <a href="https://www.google.com/maps/dir/?api=1&destination=${loc.lat},${loc.lng}" target="_blank" style="font-size:11px; color:#38bdf8; text-decoration:underline;">🧭 Ouvrir l'itinéraire</a>
                    </div>
                </div>
            `);
            markers.push(marker);
        });
    }

    // Afficher les points immédiatement sans attendre
    addMarkers();
    renderLocations();

    // 4. Géolocalisation de l'utilisateur
    if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition((position) => {
            userLat = position.coords.latitude;
            userLng = position.coords.longitude;
            
            if (!userMarker) {
                userMarker = L.circleMarker([userLat, userLng], {
                    color: '#e11d48',
                    fillColor: '#fb7185',
                    fillOpacity: 0.9,
                    radius: 8,
                    weight: 3
                }).addTo(map);
                userMarker.bindPopup("<b>📍 Votre position actuelle</b>");
            } else {
                userMarker.setLatLng([userLat, userLng]);
            }
            
            map.flyTo([userLat, userLng], 13);
            renderLocations();
            
            // Chercher des agences OSM dans un rayon de 10km autour de l'utilisateur
            fetchOsmLocations(userLat, userLng, 10000);
        }, (error) => {
            console.log("Géolocalisation refusée ou indisponible:", error.message);
        });
    }

    // 5. Recherche Overpass API optimisée (Rapide et légère)
    function fetchOsmLocations(lat, lng, radius = 10000, bbox = null) {
        let areaQuery = bbox 
            ? `(${bbox[0]},${bbox[2]},${bbox[1]},${bbox[3]})`
            : `(around:${radius},${lat},${lng})`;

        const query = `
            [out:json][timeout:10];
            (
              node["amenity"="bank"]${areaQuery};
              node["amenity"="atm"]${areaQuery};
            );
            out 35;
        `;
        
        const url = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`;
        
        fetch(url)
            .then(res => {
                if (!res.ok) throw new Error("HTTP error " + res.status);
                return res.json();
            })
            .then(data => {
                if (data && data.elements && data.elements.length > 0) {
                    const existingIds = new Set(locations.map(l => l.id));
                    data.elements.forEach(el => {
                        const tags = el.tags || {};
                        const lat = el.lat;
                        const lon = el.lon;
                        if (lat && lon && !existingIds.has(el.id)) {
                            let name = tags.name || tags.operator || (tags.amenity === 'bank' ? 'Agence Bancaire' : 'DAB Automatique');
                            locations.push({
                                id: el.id,
                                name: name,
                                type: tags.amenity === 'bank' ? 'bank' : 'atm',
                                lat: lat,
                                lng: lon,
                                address: tags['addr:street'] ? `${tags['addr:street']} ${tags['addr:city'] || ''}` : 'Adresse Tunisie',
                                working_hours: tags.opening_hours || '08:00 - 16:30'
                            });
                        }
                    });
                    addMarkers();
                    renderLocations();
                }
            })
            .catch(err => {
                // En cas d'erreur ou timeout Overpass, les données intégrées DEFAULT_LOCATIONS assurent le service
                console.log("Overpass API non joignable, utilisation des données locales:", err.message);
            });
    }

    // 6. Recherche de Région / Ville (Nominatim)
    const searchInput = document.getElementById('searchInput');
    let searchTimeout = null;

    searchInput.addEventListener('input', (e) => {
        const query = e.target.value.trim();
        if (searchTimeout) clearTimeout(searchTimeout);
        
        if (query.length < 2) {
            searchLat = null;
            searchLng = null;
            locations = [...DEFAULT_LOCATIONS];
            addMarkers();
            renderLocations();
            map.flyTo([36.8065, 10.1815], 12);
            return;
        }

        // Filtrage local immédiat sur la ville ou le nom
        const qLower = query.toLowerCase();
        const localMatches = DEFAULT_LOCATIONS.filter(l => 
            l.name.toLowerCase().includes(qLower) || 
            l.address.toLowerCase().includes(qLower)
        );
        if (localMatches.length > 0) {
            locations = localMatches;
            addMarkers();
            renderLocations();
            map.flyTo([localMatches[0].lat, localMatches[0].lng], 14);
        }

        // Compléter avec la recherche géographique Nominatim
        searchTimeout = setTimeout(() => {
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=tn&limit=1`)
                .then(response => response.json())
                .then(data => {
                    if (data && data.length > 0) {
                        searchLat = parseFloat(data[0].lat);
                        searchLng = parseFloat(data[0].lon);
                        
                        if (data[0].boundingbox) {
                            const b = data[0].boundingbox;
                            map.fitBounds([
                                [parseFloat(b[0]), parseFloat(b[2])],
                                [parseFloat(b[1]), parseFloat(b[3])]
                            ]);
                            fetchOsmLocations(searchLat, searchLng, null, b);
                        } else {
                            map.flyTo([searchLat, searchLng], 13);
                            fetchOsmLocations(searchLat, searchLng, 8000);
                        }
                    }
                })
                .catch(err => console.error("Geocoding error:", err));
        }, 600);
    });

</script>

<script src="{{ url_for('static', filename='inactivity.js') }}"></script>
</body>
