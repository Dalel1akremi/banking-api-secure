<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agences & DAB - API Bank</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <style>
        .map-layout {
            display: flex;
            gap: 20px;
            height: calc(100vh - 180px);
            margin-top: 20px;
        }
        
        .sidebar {
            width: 350px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .search-container {
            padding: 20px;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            gap: 10px;
        }
        
        .search-container input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text-main);
            outline: none;
        }
        
        .locations-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        
        .location-item {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.03);
            cursor: pointer;
            transition: background 0.2s;
            border: 1px solid transparent;
        }
        
        .location-item:hover {
            background: rgba(99, 102, 241, 0.1);
            border-color: rgba(99, 102, 241, 0.3);
        }
        
        .location-title {
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .location-type {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        
        .type-bank { background: rgba(99, 102, 241, 0.2); color: #a5b4fc; }
        .type-atm { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
        
        .location-distance {
            font-size: 13px;
            color: #fbbf24;
            margin-top: 5px;
            font-weight: 500;
        }
        
        .location-details {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 5px;
            line-height: 1.4;
        }
        
        #map {
            flex: 1;
            border-radius: 18px;
            border: 1px solid var(--card-border);
            z-index: 1; /* Keep leaflet controls below navbar */
        }
        
        /* Bright popup override */
        .leaflet-popup-content h4 {
            margin: 0 0 5px 0;
            color: #1e293b;
            font-weight: bold;
        }
        .leaflet-popup-content p {
            margin: 0;
            font-size: 12px;
            color: #475569;
        }
        
        @media (max-width: 768px) {
            .map-layout {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: 300px;
            }
            #map {
                height: 400px;
            }
        }
    </style>
</head>
<body>

{% include 'nav.html' %}

<div class="page-container" style="max-width: 1400px;">
    <div class="page-header">
        <h1>Agences et DAB les plus proches</h1>
        <p>Trouvez nos agences et distributeurs réels à proximité via OpenStreetMap.</p>
    </div>

    <div class="map-layout">
        <div class="sidebar">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Rechercher une région (ex: Sfax, Ariana)...">
            </div>
            <div class="locations-list" id="locationsList">
                <div style="padding: 20px; text-align: center; color: var(--text-muted);">
                    <p>En attente de localisation...</p>
                </div>
            </div>
        </div>
        
        <div id="map"></div>
    </div>
</div>

<script>
    let locations = [];
    let userLat = null;
    let userLng = null;
    let searchLat = null;
    let searchLng = null;
    let markers = [];
    
    // Default center (Tunis)
    const map = L.map('map').setView([36.8065, 10.1815], 11);
    
    // Add standard bright OpenStreetMap tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        maxZoom: 19
    }).addTo(map);

    // Custom Icons
    const bankIcon = L.icon({
        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-violet.png',
        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
        shadowSize: [41, 41]
    });
    
    const atmIcon = L.icon({
        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
        shadowSize: [41, 41]
    });
    
    let userMarker = null;

    function calculateDistance(lat1, lon1, lat2, lon2) {
        if (!lat1 || !lon1) return null;
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    function renderLocations() {
        const listEl = document.getElementById('locationsList');
        listEl.innerHTML = '';
        
        const centerLat = searchLat || userLat;
        const centerLng = searchLng || userLng;
        
        let displayList = [...locations];
        if (centerLat && centerLng) {
            displayList.forEach(loc => {
                loc.distance = calculateDistance(centerLat, centerLng, loc.lat, loc.lng);
            });
            // Sort by closest distance
            displayList.sort((a, b) => a.distance - b.distance);
        }

        if (displayList.length === 0) {
            listEl.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-muted);">Aucune agence ou DAB trouvé dans cette zone.</div>';
            return;
        }
        
        displayList.forEach(loc => {
            const el = document.createElement('div');
            el.className = 'location-item';
            
            const typeClass = loc.type === 'bank' ? 'type-bank' : 'type-atm';
            const typeLabel = loc.type === 'bank' ? 'Agence' : 'DAB';
            
            let distanceHtml = '';
            if (loc.distance !== null && loc.distance !== undefined) {
                distanceHtml = `<div class="location-distance">📍 à ${loc.distance.toFixed(2)} km</div>`;
            }
            
            let hoursHtml = loc.working_hours ? `<div style="margin-top: 4px; color: #4f46e5; font-weight: 500;">🕒 ${loc.working_hours}</div>` : '';

            el.innerHTML = `
                <div class="location-title">
                    ${loc.name}
                    <span class="location-type ${typeClass}">${typeLabel}</span>
                </div>
                ${distanceHtml}
                <div class="location-details">
                    <div>${loc.address}</div>
                    ${hoursHtml}
                </div>
            `;
            
            el.addEventListener('click', () => {
                map.setView([loc.lat, loc.lng], 16);
                const marker = markers.find(m => m.options.locId === loc.id);
                if (marker) marker.openPopup();
            });
            
            listEl.appendChild(el);
        });
    }

    function addMarkers() {
        markers.forEach(m => map.removeLayer(m));
        markers = [];
        
        locations.forEach(loc => {
            const icon = loc.type === 'bank' ? bankIcon : atmIcon;
            const marker = L.marker([loc.lat, loc.lng], {icon: icon, locId: loc.id}).addTo(map);
            
            let hoursHtml = loc.working_hours ? `<p style="margin-top:5px; color:#4f46e5; font-weight: bold;">🕒 ${loc.working_hours}</p>` : '';
            marker.bindPopup(`
                <h4>${loc.name}</h4>
                <p>${loc.address}</p>
                ${hoursHtml}
            `);
            markers.push(marker);
        });
    }

    function fetchRealLocations(lat, lng, bbox = null) {
        document.getElementById('locationsList').innerHTML = '<div style="padding: 20px; text-align: center; color: #fbbf24;"><p>Récupération des agences réelles...</p><small>(Cela peut prendre quelques secondes)</small></div>';
        
        let areaQuery = "";
        if (bbox) {
            // Nominatim bbox: [southLat, northLat, westLng, eastLng]
            // Overpass bbox: (southLat, westLng, northLat, eastLng)
            const s = bbox[0], n = bbox[1], w = bbox[2], e = bbox[3];
            areaQuery = `(${s},${w},${n},${e})`;
        } else {
            // Query to find nodes tagged as bank or atm within 50km (50000m)
            const radius = 50000;
            areaQuery = `(around:${radius},${lat},${lng})`;
        }

        const query = `
            [out:json][timeout:25];
            (
              nwr["amenity"="bank"]${areaQuery};
              nwr["amenity"="atm"]${areaQuery};
            );
            out center;
        `;
        
        const url = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`;
        
        fetch(url)
            .then(res => res.json())
            .then(data => {
                locations = [];
                if (data && data.elements) {
                    data.elements.forEach(el => {
                        const tags = el.tags || {};
                        if (!tags.amenity) return; // Skip geometric parts if any
                        
                        let name = tags.name || tags.operator || tags.brand || (tags.amenity === 'bank' ? 'Banque Inconnue' : 'DAB');
                        
                        // ways/relations have 'center' property with out center; nodes have lat/lon directly
                        const lat = el.lat || (el.center && el.center.lat);
                        const lon = el.lon || (el.center && el.center.lon);
                        
                        if (lat && lon) {
                            locations.push({
                                id: el.id,
                                name: name,
                                type: tags.amenity === 'bank' ? 'bank' : 'atm',
                                lat: lat,
                                lng: lon,
                                address: (tags['addr:street'] || tags['addr:city'] || 'Adresse non renseignée'),
                                working_hours: tags.opening_hours || ''
                            });
                        }
                    });
                }
                addMarkers();
                renderLocations();
            })
            .catch(err => {
                console.error("Overpass API Error:", err);
                document.getElementById('locationsList').innerHTML = '<div style="padding: 20px; text-align: center; color: #ef4444;">Erreur lors du chargement des données. Veuillez réessayer.</div>';
            });
    }

    // Try to get user geolocation
    if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition((position) => {
            userLat = position.coords.latitude;
            userLng = position.coords.longitude;
            
            if (!userMarker) {
                userMarker = L.circleMarker([userLat, userLng], {
                    color: '#e11d48',
                    fillColor: '#fb7185',
                    fillOpacity: 0.9,
                    radius: 9,
                    weight: 3
                }).addTo(map);
                userMarker.bindPopup("<b>Votre position actuelle</b>").openPopup();
            } else {
                userMarker.setLatLng([userLat, userLng]);
            }
            
            map.setView([userLat, userLng], 13);
            
            // Fetch real locations around user
            fetchRealLocations(userLat, userLng);
        }, (error) => {
            console.log("Geolocation disabled or error:", error);
            // Fallback: Fetch locations around default center
            fetchRealLocations(36.8065, 10.1815);
        });
    } else {
        fetchRealLocations(36.8065, 10.1815);
    }

    // Geocoding Search Logic (Nominatim API)
    const searchInput = document.getElementById('searchInput');
    let searchTimeout = null;

    searchInput.addEventListener('input', (e) => {
        const query = e.target.value.trim();
        
        if (searchTimeout) clearTimeout(searchTimeout);
        
        if (query.length < 3) {
            if (query.length === 0) {
                searchLat = null;
                searchLng = null;
                if (userLat && userLng) {
                    map.setView([userLat, userLng], 13);
                    if (userMarker) userMarker.openPopup();
                    fetchRealLocations(userLat, userLng);
                } else {
                    map.setView([36.8065, 10.1815], 11);
                    fetchRealLocations(36.8065, 10.1815);
                }
            }
            return;
        }

        searchTimeout = setTimeout(() => {
            document.getElementById('locationsList').innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-muted);">Recherche de la région...</div>';
            
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=tn&limit=1`)
                .then(response => response.json())
                .then(data => {
                    if (data && data.length > 0) {
                        searchLat = parseFloat(data[0].lat);
                        searchLng = parseFloat(data[0].lon);
                        
                        let bbox = null;
                        if (data[0].boundingbox) {
                            bbox = data[0].boundingbox;
                            // Fit map to the exact bounding box of the governorate/region
                            map.fitBounds([
                                [parseFloat(bbox[0]), parseFloat(bbox[2])],
                                [parseFloat(bbox[1]), parseFloat(bbox[3])]
                            ]);
                        } else {
                            map.setView([searchLat, searchLng], 10);
                        }
                        
                        // Fetch real locations within the exact bounding box
                        fetchRealLocations(searchLat, searchLng, bbox);
                    } else {
                        document.getElementById('locationsList').innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-muted);">Aucune région trouvée.</div>';
                    }
                })
                .catch(err => {
                    console.error("Geocoding error:", err);
                });
        }, 1000); // 1s delay to avoid spamming APIs
    });

</script>

<script src="{{ url_for('static', filename='inactivity.js') }}"></script>
</body>
</html>
