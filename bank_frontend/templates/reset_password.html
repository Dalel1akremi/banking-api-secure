<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Réinitialisation - API Bank</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="center-container">
    <div class="glass-box">
        <h1 class="brand">Nouveau mot de passe</h1>
        <p style="margin-bottom: 30px;">Saisissez le code reçu par email et votre nouveau mot de passe.</p>

        {% if error %}
            <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/reset-password">
            <input type="hidden" name="email" value="{{ email }}">
            
            <div class="input-group">
                <label>Code de réinitialisation</label>
                <input type="text" name="otp_code" required placeholder="Ex: 123456" maxlength="6">
            </div>

            <div class="input-group">
                <label>Nouveau mot de passe</label>
                <input type="password" name="new_password" required placeholder="Minimum 6 caractères" minlength="6">
            </div>

            <button type="submit" class="btn">Réinitialiser le mot de passe</button>
        </form>
    </div>
</div>

</body>
</html>
