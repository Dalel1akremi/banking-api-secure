version: '3.8'

services:

  # Backend FastAPI (Cœur Bancaire)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: banking_backend
    environment:
      - MONGO_URI=mongodb://host.docker.internal:27017
      - SECRET_KEY=votre_cle_secrete_ultra_securisee
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GMAIL_SENDER=${GMAIL_SENDER}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - TZ=Africa/Tunis
      - KEYCLOAK_URL=http://keycloak:8080/auth
      - KEYCLOAK_REALM=banking-realm
      - KEYCLOAK_CLIENT_ID=banking-api
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app:/app/app
      - ./security_audit.log:/app/security_audit.log

  # Frontend Flask (Interface Client)
  frontend:
    build:
      context: ./bank_frontend
      dockerfile: Dockerfile.frontend
    container_name: banking_frontend
    depends_on:
      - backend
    environment:
      - BASE_API_URL=http://backend:8000
      - TZ=Africa/Tunis
    volumes:
      - ./bank_frontend/templates:/app/templates
      - ./bank_frontend/app.py:/app/app.py
      - ./security_audit.log:/app/security_audit.log

  # Database pour Keycloak (Standard SQL)
  keycloak_db:
    image: postgres:15
    container_name: keycloak_db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data

  # Serveur d'Identité Keycloak (OAuth2 / OpenID Connect)
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command: start-dev --proxy-headers xforwarded --http-relative-path /auth
    ports:
      - "8081:8080"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak_db:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=password
      - KC_HTTP_RELATIVE_PATH=/auth
      - KC_HTTP_ENABLED=true
    depends_on:
      - keycloak_db

  # API Gateway (NGINX) - Le point d'entrée unique
  gateway:
    image: nginx:latest
    container_name: api_gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx_logs:/var/log/nginx
      - ./nginx_certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
      - keycloak

volumes:
  mongo_data:
  keycloak_db_data:
