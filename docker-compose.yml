version: '3.8'

services:

  # Backend FastAPI (Cœur Bancaire)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: banking_backend
    environment:
      - MONGO_URI=mongodb://host.docker.internal:27017
      - SECRET_KEY=votre_cle_secrete_ultra_securisee
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GMAIL_SENDER=${GMAIL_SENDER}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - TZ=Africa/Tunis
      - KEYCLOAK_URL=http://keycloak:8080/auth
      - KEYCLOAK_REALM=banking-realm
      - KEYCLOAK_CLIENT_ID=banking-api
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app:/app/app
      - ./security_audit.log:/app/security_audit.log
    networks:
      - backend_tier
      - data_tier

  # Frontend Flask (Interface Client)
  frontend:
    build:
      context: ./bank_frontend
      dockerfile: Dockerfile.frontend
    container_name: banking_frontend
    depends_on:
      - backend
    environment:
      - BASE_API_URL=http://backend:8000
      - TZ=Africa/Tunis
    volumes:
      - ./bank_frontend/templates:/app/templates
      - ./bank_frontend/app.py:/app/app.py
      - ./security_audit.log:/app/security_audit.log
    networks:
      - frontend_tier
      - backend_tier

  # Database pour Keycloak (Standard SQL)
  keycloak_db:
    image: postgres:15
    container_name: keycloak_db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - data_tier

  # Serveur d'Identité Keycloak (OAuth2 / OpenID Connect)
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command: start-dev --proxy-headers xforwarded --http-relative-path /auth
    ports:
      - "8081:8080"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak_db:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=password
      - KC_HTTP_RELATIVE_PATH=/auth
      - KC_HTTP_ENABLED=true
    depends_on:
      - keycloak_db
    networks:
      - backend_tier
      - data_tier

  # API Gateway (NGINX) - Le point d'entrée unique
  gateway:
    image: nginx:latest
    container_name: api_gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx_logs:/var/log/nginx
      - ./nginx_certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
      - keycloak
    networks:
      - frontend_tier
      - backend_tier

  # --- SIEM MONITORING (ELK STACK) ---

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - data_tier
      - monitoring_tier

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - monitoring_tier

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.0
    container_name: logstash
    volumes:
      - ./elk/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    ports:
      - "5044:5044"
    depends_on:
      - elasticsearch
    networks:
      - monitoring_tier
      - data_tier

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.12.0
    container_name: filebeat
    user: root
    command: filebeat -e --strict.perms=false
    volumes:
      - ./elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./nginx_logs:/var/log/nginx:ro
      - ./security_audit.log:/var/log/audit/security_audit.log:ro
      - ./data:/var/log/ai:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - logstash
    networks:
      - monitoring_tier
      - backend_tier

networks:
  frontend_tier:
    driver: bridge
  backend_tier:
    driver: bridge
  monitoring_tier:
    driver: bridge
  data_tier:
    internal: true

volumes:
  mongo_data:
  keycloak_db_data:
  es_data:
