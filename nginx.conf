events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # --- LOGGING FORMAT FOR SIEM (ELK/WAZUH) ---
    # Ce format permet d'extraire facilement les IP, les méthodes et les status
    log_format siem_format '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent" '
                           'rt=$request_time uct="$upstream_connect_time" uat="$upstream_addr"';

    access_log /var/log/nginx/access.log siem_format;
    error_log /var/log/nginx/error.log warn;

    # --- RATE LIMITING ---
    # Limite à 10 requêtes par seconde par adresse IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    server {
        listen 80;
        server_name localhost;

        # --- SECURITY HEADERS (Approche Zero Trust) ---
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
        
        # Supprimer la version de NGINX pour éviter le fingerprinting
        server_tokens off;

        # --- RESOLVER POUR DOCKER ---
        # 127.0.0.11 est l'adresse du DNS interne de Docker
        resolver 127.0.0.11 valid=30s;

        # --- FRONTEND PROXY ---
        location / {
            set $target_frontend http://frontend:5000;
            proxy_pass $target_frontend;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- BACKEND API PROXY ---
        location /api/ {
            # Application du Rate Limiting
            limit_req zone=api_limit burst=20 nodelay;

            # On force la résolution DNS au runtime
            set $target_backend http://backend:8000;
            
            # On retire /api/ du chemin
            rewrite ^/api/(.*) /$1 break;
            
            proxy_pass $target_backend;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /api;

            # --- Optimisations pour SSE (Alertes temps réel) ---
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;

            # --- CORRECTION MASSIVE DES REDIRECTIONS ---
            # Si le backend dit "va sur http://backend:8000/docs", Nginx dit au navigateur "va sur /api/docs"
            proxy_redirect http://backend:8000/ /api/;
            proxy_redirect http://banking_backend:8000/ /api/;
            proxy_redirect / /api/;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # --- GESTION DES ERREURS ---
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
    }
}
