events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # --- LOGGING FORMAT FOR SIEM (ELK/WAZUH) ---
    # Ce format permet d'extraire facilement les IP, les méthodes et les status
    log_format siem_format '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent" '
                           'rt=$request_time uct="$upstream_connect_time" uat="$upstream_addr"';

    access_log /var/log/nginx/access.log siem_format;
    error_log /var/log/nginx/error.log warn;

    # --- RATE LIMITING ---
    # Limite à 10 requêtes par seconde par adresse IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # --- MUTUAL TLS (mTLS) ---
        # On active la vérification du certificat client via notre CA
        ssl_client_certificate /etc/nginx/certs/ca.crt;
        ssl_verify_client optional; # 'on' pour forcer, 'optional' pour souplesse

        # --- SECURITY HEADERS (Approche Zero Trust) ---
        # NOTE: X-Frame-Options est retiré du scope global car Keycloak
        # nécessite des iframes pour sa vérification de session.
        # Il est appliqué sélectivement par route ci-dessous.
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
        
        # Supprimer la version de NGINX pour éviter le fingerprinting
        server_tokens off;

        # --- RESOLVER POUR DOCKER ---
        # 127.0.0.11 est l'adresse du DNS interne de Docker
        resolver 127.0.0.11 valid=30s;


        # --- KEYCLOAK IDENTITY SERVER PROXY ---
        location /auth {
            proxy_pass http://keycloak:8080;
            
            # Suppression des redirections manuelles qui causaient le /auth/auth/
            proxy_redirect off;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Désactiver le CSP et X-Frame-Options globaux de NGINX pour Keycloak
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header X-Frame-Options;

            # Keycloak specific proxy settings (large headers)
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # --- KEYCLOAK STATIC RESOURCES (CSS/JS) ---
        # Keycloak demande /resources/ mais il faut réécrire en /auth/resources/ 
        location /resources/ {
            rewrite ^/resources/(.*) /auth/resources/$1 break;
            proxy_pass http://keycloak:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
        }

        # --- BACKEND API PROXY ---
        location /api/ {
            # --- VALIDATION STRICTE mTLS POUR L'API ---
            # On rejette si le certificat n'est pas présent ou invalide
            if ($ssl_client_verify != SUCCESS) {
                return 400 "Erreur mTLS: Certificat client requis pour l'API Bancaire\n";
            }

            # Application du Rate Limiting
            limit_req zone=api_limit burst=20 nodelay;

            # On force la résolution DNS au runtime
            set $target_backend http://backend:8000;
            
            # On retire /api/ du chemin
            rewrite ^/api/(.*) /$1 break;
            
            proxy_pass $target_backend;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /api;
            
            # Passer les informations mTLS au backend pour audit
            proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
            proxy_set_header X-SSL-Client-DN $ssl_client_s_dn;

            # --- Optimisations pour SSE (Alertes temps réel) ---
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;

            # --- CORRECTION MASSIVE DES REDIRECTIONS ---
            # Si le backend dit "va sur http://backend:8000/docs", Nginx dit au navigateur "va sur /api/docs"
            proxy_redirect http://backend:8000/ /api/;
            proxy_redirect http://banking_backend:8000/ /api/;
            proxy_redirect / /api/;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # --- FRONTEND PROXY (Capture tout le reste) ---
        location / {
            set $target_frontend http://frontend:5000;
            proxy_pass $target_frontend;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- GESTION DES ERREURS ---
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
    }
}
